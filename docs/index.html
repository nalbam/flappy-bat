<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171116" />
  <title>Flappy Bat — Nightflight</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game" aria-label="Flappy Bat game">
    <div id="hud" aria-live="polite">
      <div class="brand"><span class="brand-mark">✦</span><span>FLAPPY BAT</span></div>
      <div class="score-card"><span class="label">SCORE</span><strong id="score">0</strong></div>
      <div class="best-card"><span class="label">BEST</span><strong id="best">0</strong></div>
    </div>
    <div id="scene" aria-hidden="true"></div>
    <section id="overlay" class="overlay ready" aria-labelledby="title">
      <div class="panel">
        <div class="eyebrow">NIGHTFLIGHT // 01</div>
        <h1 id="title">Flappy <em>Bat</em></h1>
        <p id="message">동굴 사이를 날아<br />최고 점수를 기록하세요.</p>
        <button id="startButton" type="button">날아오르기 <span>SPACE</span></button>
        <div class="tip">클릭 · 탭 · Space 로 박자를 맞추세요</div>
      </div>
    </section>
    <button id="restartButton" class="restart" type="button" aria-label="Restart game">↻ <span>다시 시작</span></button>
    <div id="touchHint" class="touch-hint">TAP TO FLAP</div>
    <div id="vignette"></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
